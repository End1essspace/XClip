# XClip tests intentionally share native desktop and SQLite integration points.
# Keep method order independent while preventing accidental in-process parallelism.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.testinstance.lifecycle.default=per_method

# A blocked executor, SQLite lock, or native call must fail with a report instead
# of leaving Gradle waiting indefinitely. Individual tests may still override this.
junit.jupiter.execution.timeout.default=30 s

# Test databases must never survive a completed test, including failed tests.
junit.jupiter.tempdir.cleanup.mode.default=ALWAYS
